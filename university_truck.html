<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>봄날엔 캠퍼스 어택 🚚🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #FF6B9D 0%, #FF8C69 50%, #FFD93D 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; }
  .emoji { font-size: 80px; margin-bottom: 24px; animation: bounce 1.2s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .title { font-size: 32px; font-weight: 900; color: #fff; margin-bottom: 16px; text-shadow: 0 2px 10px rgba(0,0,0,0.15); }
  .sub { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.92); line-height: 1.8; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="emoji">🔧</div>
    <div class="title">현재 정비 시간입니다</div>
    <div class="sub">잠시 후 다시 이용해주세요! 🌸<br>불편을 드려 죄송합니다 💛</div>
  </div>
</body>
</html>
